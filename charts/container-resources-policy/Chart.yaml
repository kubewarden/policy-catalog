annotations:
  artifacthub.io/repository: kubewarden-policy-library
  catalog.cattle.io/hidden: "true"
  catalog.cattle.io/type: kubewarden-policy
  catalog.cattle.io/ui-component: kubewarden
  kubewarden/displayName: Container Resources
  kubewarden/mutation: "true"
  kubewarden/resources: Pod, Replicationcontroller, Deployments, Replicaset, Statefulset,
    Daemonset, Job, Cronjob
  kubewarden/rules: |
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - pods
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - replicationcontrollers
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - apps
      apiVersions:
      - v1
      resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - batch
      apiVersions:
      - v1
      resources:
      - jobs
      - cronjobs
      operations:
      - CREATE
      - UPDATE
appVersion: 1.3.8
description: Policy is designed to enforce constraints on the resource requirements
  of Kubernetes containers
home: https://github.com/kubewarden/policies
keywords:
- container
- resources
name: container-resources
sources:
- ghcr.io/kubewarden/policies/container-resources:v1.3.8
version: 1.3.8
